<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Focoria：在瀏覽器檢視本機三維模型與材質" />
    <title>Focoria｜三維模型檢視器</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main id="app">
      <header class="toolbar">
        <h1>Focoria <span class="toolbar-subtitle">三維模型檢視器</span></h1>
        <span id="opened-file-name" class="opened-file-name" hidden></span>
      </header>

      <section class="workspace">
        <aside class="panel">
          <button id="open-file-button" class="file-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h6l2 2h10v11H3z" /></svg>
            載入模型
          </button>
          <input id="file-input" class="visually-hidden" type="file" multiple
            accept=".fbx,.glb,.gltf,.bin,.usd,.usda,.usdz,.png,.jpg,.jpeg,.webp,.ktx2" />
          <div class="load-help">
            <p>可開啟 GLB、glTF、FBX、自包含的 ASCII USD／USDA，以及相容的 USDZ。<code>.blend</code> 與二進位 USDC 尚未支援。</p>
            <p>模型內的材質會自動載入。外部貼圖或 <code>.bin</code> 請與主模型同次選取；瀏覽器無法自動讀取未選取的本機檔案。</p>
          </div>

          <div class="scene-picker">
            <label for="scene-select">本次選取的場景</label>
            <select id="scene-select" disabled>
              <option value="">尚未選取模型</option>
            </select>
          </div>

          <p class="material-state"><span class="material-dot" aria-hidden="true"></span><span id="usd-material-summary">尚未載入模型</span></p>
          <div id="load-feedback" class="load-feedback" hidden>
            <strong id="status" role="status" aria-live="polite">等待模型</strong>
            <progress id="progress" max="100" value="0"></progress>
          </div>
        </aside>

        <div id="viewport" aria-label="三維場景檢視區">
          <div class="drop-hint">拖放 FBX／GLB／USD 到這裡</div>
          <div class="camera-tools" aria-label="視角控制">
            <div id="orbit-gizmo" class="orbit-gizmo" aria-label="六軸視角旋鈕">
              <div id="orbit-trackball" class="orbit-trackball" role="button" tabindex="0" aria-label="拖曳圓球旋轉視角" title="拖曳旋轉視角">
                <span class="axis-spoke" data-spoke="x" aria-hidden="true"></span>
                <span class="axis-spoke" data-spoke="y" aria-hidden="true"></span>
                <span class="axis-spoke" data-spoke="z" aria-hidden="true"></span>
                <span class="axis-spoke" data-spoke="-x" aria-hidden="true"></span>
                <span class="axis-spoke" data-spoke="-y" aria-hidden="true"></span>
                <span class="axis-spoke" data-spoke="-z" aria-hidden="true"></span>
              </div>
              <button class="axis-ball" type="button" data-axis="x" aria-label="切換至 X 正軸視角" title="X 正軸視角">X</button>
              <button class="axis-ball" type="button" data-axis="y" aria-label="切換至 Y 正軸視角" title="Y 正軸視角">Y</button>
              <button class="axis-ball" type="button" data-axis="z" aria-label="切換至 Z 正軸視角" title="Z 正軸視角">Z</button>
              <button class="axis-ball" type="button" data-axis="-x" aria-label="切換至 X 負軸視角" title="X 負軸視角"></button>
              <button class="axis-ball" type="button" data-axis="-y" aria-label="切換至 Y 負軸視角" title="Y 負軸視角"></button>
              <button class="axis-ball" type="button" data-axis="-z" aria-label="切換至 Z 負軸視角" title="Z 負軸視角"></button>
            </div>
            <div class="camera-pad" aria-label="鏡頭平移控制">
              <button type="button" data-camera-move="up" aria-label="鏡頭向上平移">▲</button>
              <button type="button" data-camera-move="left" aria-label="鏡頭向左平移">◀</button>
              <button type="button" data-camera-move="right" aria-label="鏡頭向右平移">▶</button>
              <button type="button" data-camera-move="down" aria-label="鏡頭向下平移">▼</button>
            </div>
            <button id="reset-camera" class="camera-action" type="button">重設視角</button>
            <button id="orbit-animation" class="camera-action presentation-action" type="button" aria-pressed="false">▶ 360° 展示</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
